name: CI Pipeline

on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - dev

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v2

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '23'
      
      - name: Install Gitleaks
        run: |
          sudo apt-get update && sudo apt-get install gitleaks

      - name: Frontend Compilation
        working-directory: client
        run: |
          find . -name "*.js" -exec node --check {} +

      - name: Backend Compilation
        working-directory: api
        run: |
          find . -name "*.js" -exec node --check {} +

      - name: GitLeaks Scan on Frontend
        run: gitleaks detect --source ./client --exit-code 1

      - name: GitLeaks Scan on Backend
        run: gitleaks detect --source ./api --exit-code 1

      - name: Set up SonarQube
        uses: sonarsource/sonarqube-scan-action@master
        with:
          # Assuming you have a SonarCloud account and the necessary environment variables set
          projectBaseDir: .
          args: >
            -Dsonar.projectKey=NodeJS-Project
            -Dsonar.projectName=NodeJS-Project
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

      - name: SonarQube Quality Gate check
        id: sonarqube-quality-gate-check
        uses: sonarsource/sonarqube-quality-gate-action@master
        with:
          pollingTimeoutSec: 600
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: Trivy FS Scan
        run: trivy fs --format table -o fs-report.html .